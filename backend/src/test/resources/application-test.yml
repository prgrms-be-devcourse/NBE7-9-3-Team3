spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true

# AWS 설정을 테스트용으로 모킹
cloud:
  aws:
    credentials:
      access-key: test-access-key
      secret-key: test-secret-key
    region:
      static: ap-northeast-2
    s3:
      bucket: test-bucket

# JWT 설정
custom:
  jwt:
    secretPattern: "testSecretKey123456789012345678901234567890"  # 32자 이상의 시크릿 키
    expireSeconds: 86400  # 24시간
    shortExpireSeconds: 600  # 10분

# 로깅 설정
logging:
  level:
    org.example.backend: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
