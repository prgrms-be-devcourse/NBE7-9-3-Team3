# AWS 설정을 테스트용으로 모킹
cloud:
  aws:
    credentials:
      access-key: test-access-key
      secret-key: test-secret-key
    region:
      static: ap-northeast-2
    s3:
      bucket: test-bucket

# JWT 설정
custom:
  jwt:
    secretPattern: "testSecretKey123456789012345678901234567890"  # 32자 이상의 시크릿 키
    expireSeconds: 86400  # 24시간
    shortExpireSeconds: 600  # 10분
    refreshExpireSeconds: 604800  # 7일

# 로깅 설정
logging:
  level:
    org.example.backend: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
