name: check testcode before PR
on:
  pull_request:
    types: [opened, reopened, synchronize] # synchronize: PR에 commit push 
    paths:
      - "backend/src/main/**"
      - "backend/src/test/**"
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # PR 올린 레포지토리로 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4

      # JDK 설치
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Docker Buildx 설정 (Testcontainers 호환성 향상) !!
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 도커 mysql 이미지 캐시
      - name: Cache Docker image for Testcontainers
        id: docker-cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/mysql-image.tar
          key: docker-image-mysql-8-0-33
          restore-keys: docker-image-mysql-

      # GitHub Actions 두번째 실행부터는 캐시된 docker 이미지 load
      # 즉, PR후 push가 발행한다면, 해당 로직 수행
      - name: Load cached Docker image (if exists)
        if: steps.docker-cache.outputs.cache-hit == 'true'
        run: |
          echo "Loading cached Docker image..."
          docker load -i /tmp/mysql-image.tar

      # GitHhb Actions 최초 실행시, docker pull
      - name: Pull Docker image (first run only)
        if: steps.docker-cache.outputs.cache-hit != 'true'
        run: |
          echo "Pulling MySQL docker image..."
          docker pull mysql:8.0.33
          docker save mysql:8.0.33 -o /tmp/mysql-image.tar

      # Testcontainers용 Ryuk 이미지도 미리 Pull !!
      - name: Pull Testcontainers Ryuk image
        run: |
          echo "Pulling Testcontainers Ryuk image..."
          docker pull testcontainers/ryuk:0.5.1 || docker pull testcontainers/ryuk:latest
          docker images | grep ryuk
      
      # Gradle 캐시
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # PR의 모든 commit 메시지가 'test:'를 포함하고 있는 지 검사
      - name: Check if all commit messages contain 'test:'
        id: skip-check
        uses: actions/github-script@v7
        with:
          script: |
            const commits = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            const allContainTest = commits.data.every(c => c.commit.message.includes('test:'));
            core.setOutput('skip', allContainTest ? 'true' : 'false');
            console.log(`All commits contain 'test': ${allContainTest}`);
            
      # 모든 커밋이 'test:'일 때 exit 0로 종료 (성공 처리)
      - name: Skip tests but mark as success
        if: steps.skip-check.outputs.skip == 'true'
        run: echo "✨ All commits contain 'test'. Marking workflow as SUCCESS without running tests."
          
      # 실행 권한 부여
      - name: Grant execute permission for gradlew
        if: steps.skip-check.outputs.skip == 'false'
        working-directory: ./backend
        run: chmod +x gradlew

      # Testcontainers 환경 설정 !!
      - name: Setup Testcontainers environment
        if: steps.skip-check.outputs.skip == 'false'
        run: |
          # Docker 소켓 권한 설정
          sudo chmod 666 /var/run/docker.sock
          
          # Testcontainers 설정 파일 생성
          mkdir -p ~/.testcontainers
          cat > ~/.testcontainers/testcontainers.properties << EOF
          docker.client.strategy=org.testcontainers.dockerclient.UnixSocketClientProviderStrategy
          testcontainers.reuse.enable=false
          checks.disable=false
          ryuk.container.privileged=true
          EOF
          
          echo "=== Testcontainers Config ==="
          cat ~/.testcontainers/testcontainers.properties

      # 테스트 실행
      - name: Run tests
        if: steps.skip-check.outputs.skip == 'false'
        working-directory: ./backend
        env:
          # testcontainers 실행시 발생할 수 있는 메모리 부족 방지를 위해 최대 힙메모리 지정
          GRADLE_OPTS: "-Xmx1024m"
        run: ./gradlew clean test
